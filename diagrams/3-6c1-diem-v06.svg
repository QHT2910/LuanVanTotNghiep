<svg xmlns="http://www.w3.org/2000/svg" width="760" height="923" viewBox="0 0 760 923"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="128" y="12" width="164" height="48" fill="white" stroke="black"/><text x="210" y="43" font-family="Arial" font-size="20" text-anchor="middle">Máy chủ</text><line x1="210" y1="60" x2="210" y2="923" stroke="#999" stroke-dasharray="4 4"/><rect x="36" y="280" width="704" height="324" fill="none" stroke="#777"/><rect x="20" y="159" width="720" height="588" fill="none" stroke="#777"/><rect x="25" y="100" width="710" height="39" fill="#f2f2f2" stroke="#aaa"/><text x="38" y="126" font-family="Arial" font-size="20" text-anchor="start">Q2: từ nhánh qua rổ ở panel (b2)</text><text x="30" y="184" font-family="Arial" font-size="20" text-anchor="start">alt [scored = false]</text><text x="270" y="224" font-family="Arial" font-size="20" text-anchor="start">Cộng pointValue, scored = true</text><path d="M 210 237 h 90 v 20 h -90" fill="none" stroke="black" marker-end="url(#arrow)"/><text x="46" y="305" font-family="Arial" font-size="20" text-anchor="start">alt [Người ném đạt ít nhất 11 điểm]</text><text x="270" y="345" font-family="Arial" font-size="20" text-anchor="start">Finished, xác nhận kết quả</text><path d="M 210 358 h 90 v 20 h -90" fill="none" stroke="black" marker-end="url(#arrow)"/><line x1="36" y1="401" x2="740" y2="401" stroke="#777" stroke-dasharray="5 4"/><text x="46" y="426" font-family="Arial" font-size="20" text-anchor="start">else [Chưa đạt điều kiện thắng]</text><text x="270" y="466" font-family="Arial" font-size="20" text-anchor="start">Check-ball, cấp bóng người bị ghi điểm</text><path d="M 210 479 h 90 v 20 h -90" fill="none" stroke="black" marker-end="url(#arrow)"/><text x="270" y="542" font-family="Arial" font-size="20" text-anchor="start">Đặt lại vị trí hai nhân vật</text><