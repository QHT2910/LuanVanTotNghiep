<svg xmlns="http://www.w3.org/2000/svg" width="760" height="884" viewBox="0 0 760 884"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="128" y="12" width="164" height="48" fill="white" stroke="black"/><text x="210" y="43" font-family="Arial" font-size="20" text-anchor="middle">Máy chủ</text><line x1="210" y1="60" x2="210" y2="884" stroke="#999" stroke-dasharray="4 4"/><rect x="20" y="159" width="720" height="625" fill="none" stroke="#777"/><rect x="25" y="100" width="710" height="39" fill="#f2f2f2" stroke="#aaa"/><text x="38" y="126" font-family="Arial" font-size="20" text-anchor="start">Q4: trong tick ở panel (b1)</text><text x="30" y="184" font-family="Arial" font-size="20" text-anchor="start">alt [Qua rổ đúng chiều, đúng shotId hiện hành]</text><rect x="25" y="204" width="710" height="39" fill="#f2f2f2" stroke="#aaa"/><text x="38" y="230" font-family="Arial" font-size="20" text-anchor="start">Q2 → panel (c1), rồi trở về</text><line x1="20" y1="263" x2="740" y2="263" stroke="#777" stroke-dasharray="5 4"/><text x="30" y="288" font-family="Arial" font-size="20" text-anchor="start">else [Event cũ hoặc khác shotId]</text><text x="270" y="328" font-family="Arial" font-size="20" text-anchor="start">Bỏ event, không cộng điểm</text><path d="M 210 341 h 90 v 20 h -90" fill="none" stroke="black" marker-end="url(#arrow)"/><text x="270" y="404" font-family="Arial" font-size="20" text-anchor="start">Tiếp tục cú ném hiện hành</text><path d="M 210 417 h 90 v 20 h -90" fill="none" stroke="black" marker-end="url(#arrow)"/><line x1="20" y1="460" x2="740" y2="460" stroke="#777" stroke-dasharray="5 4"/><text x="30" y="485" font-family="Arial" font-size="20" text-anchor="start">else [Trượt đã được giải quyết]</text><text x="270" y="525" font-family="Arial" font-size="20" text-anchor="start">Bóng tự do, vô hiệu cú ném</text><path d="M 210 538 h 90 v 20 h -90" fill="none" stroke="black" marker-end="url(#arrow)"/><text x="270" y="601" font-family="Arial" font-size="20" text-anchor="start">resolved = true</text><path d="M 210 614 h 90 v 20 h -90" fill="none" stroke="black" marker-end="url(#arrow)"/><line x1="20" y1="657" x2="740" y2="657" stroke="#777" stroke-dasharray="5 4"/><text x="30" y="682" font-family="Arial" font-size="20" text-anchor="start">else [Bóng còn bay]</text><text x="270" y="722" font-family="Arial" font-size="20" text-anchor="start">resolved = false</text><path d="M 210 735 h 90 v 20 h -90" fill="none" stroke="black" marker-end="url(#arrow)"/><rect x="25" y="800" width="710" height="39" fill="#f2f2f2" stroke="#aaa"/><text x="38" y="826" font-family="Arial" font-size="20" text-anchor="start">Trả về Q3 ở panel (b1)</text><polygon points="210,361 220,356 220,366" fill="black"/><polygon points="210,437 220,432 220,442" fill="black"/><polygon points="210,558 220,553 220,563" fill="black"/><polygon points="210,634 220,629 220,639" fill="black"/><polygon points="210,755 220,750 220,760" fill="black"/></svg>