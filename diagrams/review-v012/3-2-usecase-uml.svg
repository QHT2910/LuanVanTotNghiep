<g id="uc-3"><ellipse cx="650" cy="380" rx="210" ry="36" fill="white" style="stroke: black;"></ellipse><text x="650" y="386" text-anchor="middle" font-size="24" stroke="none" fill="#000000" style="fill: black; font-family: &quot;Times New Roman&quot;;">UC03 — Điều khiển nhân vật</text></g>
