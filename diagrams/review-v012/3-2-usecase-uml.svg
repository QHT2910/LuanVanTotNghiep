<svg xmlns="http://www.w3.org/2000/svg" width="1724" height="1792.96" viewBox="0 0 1000 1040" role="img" aria-labelledby="title desc" style="max-width: none;">
<title id="title">Use case tổng quát — Bóng rổ đối kháng 3D</title>
<desc id="desc">Thiết kế đề xuất. Một actor Người chơi, đại diện cho mỗi người trong hai người chơi, liên kết với tám use case trong ranh giới ứng dụng và máy chủ. Không có quan hệ include hoặc extend.</desc>
<rect width="1000" height="1040" fill="white" style="fill: white;"></rect>
<g font-family="Times New Roman" fill="#f2f2f2" stroke="#000000" stroke-width="2">
<text x="500" y="38" text-anchor="middle" font-size="25" stroke="none" fill="#000000" style="fill: black; font-family: &quot;Times New Roman&quot;;">Use case tổng quát — Bóng rổ đối kháng 3D</text>
<text x="500" y="69" text-anchor="middle" font-size="24" stroke="none" fill="#000000" style="fill: black; font-family: &quot;Times New Roman&quot;;">Mô hình chức năng của thiết kế 1v1</text>
<rect id="system-boundary" x="380" y="100" width="540" height="860" fill="none" style="stroke: black;"></rect>
<text x="650" y="130" text-anchor="middle" font-size="24" stroke="none" fill="#000000" style="fill: black; font-family: &quot;Times New Roman&quot;;">Hệ thống: ứng dụng và máy chủ</text>
<g id="actor-player">
<circle cx="120" cy="425" r="23" fill="white" style="stroke: black;"></circle>
<path d="M120 448 V510 M80 480 H160 M120 510 L85 555 M120 510 L155 555" fill="none" style="stroke: black;"></path>
<text x="120" y="592" text-anchor="middle" font-size="24" stroke="none" fill="#000000" style="fill: black; font-family: &quot;Times New Roman&quot;;">Người chơi</text>
<text x="120" y="620" text-anchor="middle" font-size="24" stroke="none" fill="#000000" style="fill: black; font-family: &quot;Times New Roman&quot;;">Vai trò của mỗi người</text>
<text x="120" y="642" text-anchor="middle" font-size="24" stroke="none" fill="#000000" style="fill: black; font-family: &quot;Times New Roman&quot;;">trong hai người chơi</text>
</g>
<line id="association-1" x1="160" y1="480" x2="440" y2="180" style="stroke: black;"></line>
<g id="uc-1"><ellipse cx="650" cy="180" rx="210" ry="36" fill="white" style="stroke: black;"></ellipse><text x="650" y="186" text-anchor="middle" font-size="24" stroke="none" fill="#000000" style="fill: black; font-family: &quot;Times New Roman&quot;;">UC01 — Tạo hoặc vào phòng</text></g>
