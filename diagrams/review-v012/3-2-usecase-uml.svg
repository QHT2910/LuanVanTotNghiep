<text x="500" y="1000" text-anchor="middle" font-size="24" stroke="none" fill="#000000" style="fill: black; font-family: &quot;Times New Roman&quot;;">Đường liền: association giữa actor và use case; không biểu diễn thứ tự xử lý.</text></g></svg>